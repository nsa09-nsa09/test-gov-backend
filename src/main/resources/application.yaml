server:
  port: 8080

spring:
  application:
    name: alem

keycloak:
  server-url: http://localhost:8180
  realm: GovApps
  client-id: test-app
  service-client:
    client-id: alem-backend
    client-secret: alem-secret-key-12345
  admin:
    realm: master
    client-id: admin-cli
    username: admin
    password: admin

cors:
  allowed-origins:
    - http://localhost:5173

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
